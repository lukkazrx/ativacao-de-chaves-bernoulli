<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Bernoulli — Ativação de Chaves</title>
  <link rel="stylesheet" href="/style.css" />
  <link rel="icon" sizes="16x16" type="image/png" href="/img/favicon-16x16.png">
</head>
<body>

  <header>
    <div class="header-inner">
      <div class="logo">
        <span class="logo-icon">⬡</span>
        <span class="logo-text">Bernoulli <em>Auto</em></span>
      </div>
      <div class="status-pill" id="statusPill">
        <span class="dot"></span> API offline
      </div>
    </div>
  </header>

  <main>

    <!-- FORMULÁRIO -->
    <section class="card" id="formCard">
      <div class="card-label">Configuração</div>

      <div class="form-row">
        <div class="field-group">
          <label>Login</label>
          <input type="text" id="login" placeholder="seu.login" autocomplete="off"/>
        </div>
        <div class="field-group">
          <label>Senha</label>
          <input type="password" id="senha" placeholder="••••••••"/>
        </div>
      </div>

      <div class="form-row">
        <div class="field-group">
          <label>Coleção</label>
          <select id="colecao">
            <option value="EF6">EF6</option>
            <option value="MATBAS6">MATBAS6</option>
            <option value="EF7">EF7</option>
            <option value="MATBAS7">MATBAS7</option>
            <option value="EF8">EF8</option>
            <option value="MATBAS8">MATBAS8</option>
            <option value="EF9">EF9</option>
            <option value="MATBAS9">MATBAS9</option>
            <option value="EM1">EM1</option>
            <option value="MATBAS1">MATBAS1</option>
            <option value="EM2">EM2</option>
            <option value="MATBAS2">MATBAS2</option>
            <option value="MAISBIO">MAISBIO</option>
            <option value="MAISFIS">MAISFIS</option>
            <option value="MAISGEO">MAISGEO</option>
            <option value="MAISHIS">MAISHIS</option>
            <option value="MAISMAT">MAISMAT</option>
            <option value="MAISQUI">MAISQUI</option>
            <option value="MRED">MRED</option>
            <option value="EM3">EM3</option>
            <option value="OFICINARED">OFICINARED</option>
            <option value="RACIOITI">RACIOITI</option>
            <option value="2V1S">2V1S</option>
          </select>
        </div>
        <div class="field-group">
          <label>Volume</label>
          <select id="volume">
            <option value="Volume 1">Volume 1</option>
            <option value="Volume 2">Volume 2</option>
            <option value="Volume 3">Volume 3</option>
            <option value="Volume 4">Volume 4</option>
            <option value="Volume 5">Volume 5</option>
            <option value="Volume Único">Volume Único</option>
          </select>
        </div>
        <div class="field-group">
          <label>Ano Letivo</label>
          <select id="anoLetivo">
            <option value="2026" selected>2026</option>
            <option value="2027">2027</option>
            <option value="2028">2028</option>
          </select>
        </div>
      </div>

      <div class="form-row">
        <div class="field-group" style="flex:1">
          <label>Arquivo de Alunos</label>
          <div class="file-drop" id="fileDrop">
            <input type="file" id="csvFile" accept=".csv,.xlsx" hidden/>
            <span class="file-icon">📎</span>
            <span class="file-label" id="fileLabel">Clique ou arraste o arquivo .csv ou .xlsx</span>
          </div>
        </div>
      </div>

      <div class="bottom-actions">
        <div class="cred-group">
          <label>Credenciais</label>
          <div class="cred-btns">
            <button class="btn-secundario" id="btnSalvarCred">💾 Salvar</button>
            <button class="btn-perigo" id="btnApagarCred">🗑 Apagar</button>
          </div>
        </div>
        <button class="btn-executar" id="btnExecutar">
          <span>Executar Automação</span>
          <span class="btn-arrow">→</span>
        </button>
      </div>
    </section>

    <!-- LOG EM TEMPO REAL -->
    <section class="card" id="logCard">
      <div class="card-label">Log em Tempo Real</div>
      <div class="log-box" id="logBox">
        <span class="log-placeholder">O log aparecerá aqui durante a execução...</span>
      </div>
      <div class="log-footer">
        <button class="btn-secundario" id="btnLimparLog">✕ Limpar</button>
        <button class="btn-perigo" id="btnPararAutomacao">⏹ Parar</button>
      </div>
    </section>

    <!-- DASHBOARD -->
    <section class="card" id="dashboardCard">
      <div class="dash-top">
        <div class="card-label" style="margin-bottom:0">Dashboard</div>
        <select id="dashSelect">
          <option value="geral">Visão Geral</option>
        </select>
      </div>
      <div class="dashboard-grid">
        <div class="dash-metric">
          <span class="dash-value" id="dashTotalChaves">—</span>
          <span class="dash-label">Chaves ativadas no total</span>
        </div>
        <div class="dash-metric">
          <span class="dash-value" id="dashTaxaSucesso">—</span>
          <span class="dash-label">Taxa de sucesso</span>
        </div>
        <div class="dash-metric">
          <span class="dash-value" id="dashTotalExecucoes">—</span>
          <span class="dash-label">Execuções realizadas</span>
        </div>
      </div>
      <div class="dash-chart-wrap">
        <canvas id="dashChart"></canvas>
      </div>
    </section>

    <!-- HISTÓRICO -->
    <section class="card" id="historicoCard">
      <div class="card-label">Histórico de Execuções</div>
      <div id="historicoBox">
        <span class="log-placeholder">Nenhuma execução registrada ainda.</span>
      </div>
      <div class="hist-actions">
        <button class="btn-secundario" id="btnHistorico">↻ Atualizar</button>
        <button class="btn-secundario" id="btnExportarPDF">📄 Exportar PDF</button>
        <button class="btn-secundario" id="btnExportarExcel">📊 Exportar Excel</button>
        <button class="btn-perigo" id="btnLimparHistorico">🗑 Limpar tudo</button>
      </div>
    </section>

  </main>

  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="https://cdn.sheetjs.com/xlsx-0.20.1/package/dist/xlsx.full.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
  <script src="/script.js"></script>
</body>
</html>
